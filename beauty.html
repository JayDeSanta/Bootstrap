<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* More Romantic, Deep Velvet & Rose Gradient Background */
        body {
            background: linear-gradient(-45deg, #2b081d, #64123a, #b31e51, #e65c84);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Slow breathing animation for the romantic background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container Card - softened to blend beautifully with the deep background */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #b31e51;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #3a3a3a;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            position: relative;
        }

        .btn {
            padding: 10px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff477e, #b31e51);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(230, 92, 132, 0.4);
        }

        #noBtn {
            background-color: #7f8c8d;
            color: white;
            position: absolute;
            left: 55%; 
        }

        /* Falling Emoji Styles */
        .emoji {
            position: absolute;
            top: -50px;
            font-size: 1.5rem;
            animation: fall linear forwards;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Success State */
        .celebrate h1 {
            font-size: 3rem;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="card" id="proposalCard">
        <h1 id="heading">Will you be mine? 💖</h1>
        <p id="message">Every moment spent with you feels like a beautiful dream. I want to share all my tomorrows with you. What do you say?</p>
        
        <div class="btn-container">
            <button class="btn" id="yesBtn" onclick="acceptProposal()">Yes!</button>
            <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        // --- Falling Emojis Logic ---
        const emojis = ['💖', '💝', '✨', '💍', '🌸', '🥰', '🌹'];
        
        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji');
            
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.fontSize = Math.random() * (35 - 18) + 18 + 'px';
            
            const duration = Math.random() * (6 - 3) + 3; 
            emoji.style.animationDuration = duration + 's';
            emoji.style.opacity = Math.random() * (1 - 0.6) + 0.6; // Slightly higher opacity for visibility

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, duration * 1000);
        }

        let emojiInterval = setInterval(createEmoji, 250); // Slightly faster initial flow

        // --- Runaway "No" Button Logic ---
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            
            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // --- "Yes" Button Success Logic ---
        function acceptProposal() {
            const card = document.getElementById('proposalCard');
            const heading = document.getElementById('heading');
            const message = document.getElementById('message');
            const btnContainer = document.querySelector('.btn-container');

            card.classList.add('celebrate');
            heading.innerText = "YAYYY! 🎉💕";
            message.innerText = "You've made me the happiest person alive! I can't wait for our beautiful journey together.";
            
            btnContainer.style.display = 'none';

            // Radical emoji explosion
            clearInterval(emojiInterval);
            emojiInterval = setInterval(createEmoji, 40); 
        }
    </script>
</body>
</html>
